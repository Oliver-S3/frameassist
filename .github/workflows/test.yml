name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # x86 for speed, arm64 to match the Steam Frame's CPU.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg 2>/dev/null || true
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
