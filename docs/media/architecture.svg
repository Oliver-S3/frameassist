<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b9dc3"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1f2d3d">Streamed-PC dictation</text>
  <text x="40" y="68" font-size="14" fill="#5b6b7c">Speak on the headset - text lands in the focused app on your PC. Nothing else is sent.</text>

  <!-- Headset -->
  <rect x="40" y="120" width="230" height="190" rx="10" fill="#eef3fa" stroke="#7f9cc1" stroke-width="2"/>
  <text x="60" y="150" font-size="16" font-weight="600" fill="#1f2d3d">Steam Frame headset</text>
  <text x="60" y="176" font-size="13" fill="#33475b">Hold both grips - talk</text>
  <text x="60" y="198" font-size="13" fill="#33475b">Speech + dictation on-device</text>
  <text x="60" y="220" font-size="13" fill="#33475b">Light edits (AI polish optional)</text>
  <text x="60" y="246" font-size="13" fill="#33475b">Stick press = Enter / Escape</text>
  <text x="60" y="276" font-size="13" fill="#33475b">hostlink client signs each message</text>

  <!-- LAN -->
  <rect x="330" y="120" width="300" height="190" rx="10" fill="#f6f8fa" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="350" y="150" font-size="15" font-weight="600" fill="#1f2d3d">Your LAN (optional)</text>
  <text x="350" y="178" font-size="13" fill="#33475b">TCP 0.0.0.0:8763</text>
  <text x="350" y="200" font-size="13" fill="#33475b">newline-delimited JSON</text>
  <text x="350" y="222" font-size="13" fill="#33475b">HMAC-signed (pairing code)</text>
  <text x="350" y="244" font-size="13" fill="#33475b">"Type into: A streamed PC"</text>
  <text x="350" y="276" font-size="13" fill="#5b6b7c">The streamed PC runs the helper.</text>
  <text x="350" y="296" font-size="13" fill="#5b6b7c">No cloud involved.</text>

  <!-- PC helper -->
  <rect x="690" y="120" width="230" height="190" rx="10" fill="#eef3fa" stroke="#7f9cc1" stroke-width="2"/>
  <text x="710" y="150" font-size="16" font-weight="600" fill="#1f2d3d">PC helper</text>
  <text x="710" y="176" font-size="13" fill="#33475b">FrameAssistHost.exe</text>
  <text x="710" y="198" font-size="13" fill="#33475b">Waits for signed text</text>
  <text x="710" y="220" font-size="13" fill="#33475b">Types with SendInput</text>
  <text x="710" y="242" font-size="13" fill="#33475b">Into the FOCUSED app</text>
  <text x="710" y="268" font-size="13" fill="#33475b">Keep the window minimised</text>
  <text x="710" y="288" font-size="13" fill="#33475b">so it can't focus itself</text>

  <!-- Arrow: headset -> LAN -> helper -->
  <line x1="270" y1="215" x2="328" y2="215" stroke="#8b9dc3" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="630" y1="215" x2="688" y2="215" stroke="#8b9dc3" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Output app -->
  <rect x="40" y="330" width="880" height="60" rx="10" fill="#f8fbf5" stroke="#8ab07f" stroke-width="2"/>
  <text x="60" y="358" font-size="15" font-weight="600" fill="#2f4b2a">Typed where you look - the app that has focus on the PC</text>
  <text x="60" y="378" font-size="13" fill="#557a4d">Notepad, a browser, chat, a form, a terminal - no apps installed on the Frame, no changes to the PC beyond the helper.</text>
</svg>
