[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "frameassist"
version = "1.4.3"
description = "FrameAssist: voice typing for the Steam Frame. Hold both grips, talk, let go."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "faster-whisper>=1.0.2",
    "PySide6-Essentials>=6.5",
    "openvr>=2.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
frameassist = "frameassist.app:main"

[tool.setuptools]
# frameassist.steamvr holds only the action manifest (data), but setuptools
# still treats the folder as a namespace package; list it so the manifest is
# packaged without the "Package would be ignored" warning.
packages = ["frameassist", "frameassist.steamvr"]

[tool.setuptools.package-data]
frameassist = ["icon.png", "capsule.png"]
"frameassist.steamvr" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
